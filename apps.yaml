###############################################################################
# Configuration globale Pyscript
###############################################################################

pyscript:
  autoload: false
  allow_all_imports: true
  hass_is_global: true

###############################################################################
# Configuration des applications
###############################################################################

apps:

  # Résumé du sommeil
  sleep_summary:
    persist_state: true

  # FusionSolar
  fusionsolar:
    persist_state: false

